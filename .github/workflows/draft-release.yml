name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH, e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Version must be MAJOR.MINOR.PATCH without a v prefix or leading zeros.'
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check out current main and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify successful CI and unused version
        id: candidate
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          conclusion=$(gh run list --workflow ci.yml --branch main --event push \
            --commit "$sha" --limit 1 --json status,conclusion \
            --jq '.[0] | if .status == "completed" then .conclusion else "not_completed" end')
          if [[ "$conclusion" != success ]]; then
            echo "::error::The latest push CI run for main commit $sha must succeed before release preparation."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Tag $RELEASE_TAG already exists."
            exit 1
          fi
          release_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          if grep -Fxq "$RELEASE_TAG" <<< "$release_tags"; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create tag and draft GitHub Release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA"
          url=$(gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes)
          {
            echo "### Draft release: $RELEASE_TAG"
            echo "Commit: $RELEASE_SHA"
            echo "Review and **manually publish** the draft to build and publish the Docker image: $url"
          } >> "$GITHUB_STEP_SUMMARY"
