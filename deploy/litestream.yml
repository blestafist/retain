access-key-id: "${R2_ACCESS_KEY_ID}"
secret-access-key: "${R2_SECRET_ACCESS_KEY}"

snapshot:
  interval: 24h
  retention: 720h

dbs:
  - path: /data/retain.db
    replica:
      type: s3
      bucket: "${R2_BUCKET}"
      path: retain/retain.db
      endpoint: "${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      region: auto
