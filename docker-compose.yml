name: retain

services:
  retain:
    image: ghcr.io/blestafist/retain:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      DATABASE_PATH: /data/retain.db
      HTTP_ADDR: :8080
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-cx/gpt-6-luna}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30s}
      LLM_DAILY_LIMIT_PER_USER: ${LLM_DAILY_LIMIT_PER_USER:-300}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - type: bind
        source: "${DATA_DIR:-./data}"
        target: /data
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 20s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
